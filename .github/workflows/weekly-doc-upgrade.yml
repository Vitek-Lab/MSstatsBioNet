# .github/workflows/weekly-doc-upgrade.yml
#
# SETUP INSTRUCTIONS:
# 1. Add your OpenAI API key as a GitHub Secret:
#    Repo Settings → Secrets → Actions → New secret → OPENAI_API_KEY
#
# 2. Give Actions write permissions:
#    Repo Settings → Actions → General → Workflow permissions → Read and write
#
# Scripts live in .github/scripts/ and are called directly from each step.

name: Weekly AI Doc Upgrade

on:
  pull_request:             # Triggers on any PR opened/updated — for testing
  workflow_dispatch:        # Also allows manual trigger from the Actions tab

jobs:
  doc-upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openai

      - name: Pick a random exported function
        id: pick_target
        run: python3 .github/scripts/pick_target.py

      - name: Upgrade docs with AI
        env:
          OPENAI_API_KEY:  ${{ secrets.MSSTATS_OPENAI_KEY }}
          TARGET_FILE:     ${{ steps.pick_target.outputs.target_file }}
          TARGET_FUNCTION: ${{ steps.pick_target.outputs.target_function }}
        run: python3 .github/scripts/upgrade_docs.py

      - name: Create branch and commit
        env:
          TARGET_FILE:     ${{ steps.pick_target.outputs.target_file }}
          TARGET_FUNCTION: ${{ steps.pick_target.outputs.target_function }}
        run: |
          BRANCH="ai-docs/$(date +%Y-%m-%d)-${TARGET_FUNCTION}"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add "$TARGET_FILE"
          git commit -m "docs: AI-generated doc upgrade for \`${TARGET_FUNCTION}\`

          Auto-generated by weekly doc workflow.
          Target: ${TARGET_FILE}::${TARGET_FUNCTION}
          Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          git push origin "$BRANCH"

      - name: Open Pull Request
        env:
          GH_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          TARGET_FILE:     ${{ steps.pick_target.outputs.target_file }}
          TARGET_FUNCTION: ${{ steps.pick_target.outputs.target_function }}
        run: |
          gh pr create \
            --title "docs: Weekly AI doc upgrade for \`${TARGET_FUNCTION}\`" \
            --body "## 🤖 Automated Documentation Upgrade

          This PR was auto-generated by the weekly doc upgrade workflow.

          **File:** \`${TARGET_FILE}\`
          **Function:** \`${TARGET_FUNCTION}\`

          **What to check:**
          - [ ] The description is accurate
          - [ ] Param types and names are correct
          - [ ] Examples actually work
          - [ ] No logic was accidentally changed

          > Merge if it looks good, close if not. Next week the bot will pick a different function." \
            --base devel \
            --head "$BRANCH" \
            --label "documentation"
